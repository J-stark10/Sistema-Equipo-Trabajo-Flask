{% extends 'base.html' %}

{% block title %} Registro {% endblock %}

{% block content %}

<div class="min-h-[60vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-lg">
        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold">
                Crear Cuenta
            </h1>

            <p class="text-zinc-400 text-sm mt-2">
                Registro de Usuario
            </p>

        </div>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm text-zinc-400 mb-2">
                    Nombre de Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition"
                    placeholder="javi">
            </div>

            <div>
                <label class="block text-sm text-zinc-400 mb-2">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition"
                    placeholder="••••••••">
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-medium transition">
                Registrarse
            </button>

        </form>

        <div class="flex items-center my-6">
            <div class="flex-1 border-t border-zinc-700"></div>
            <span class="px-3 text-zinc-500 text-sm">o</span>
            <div class="flex-1 border-t border-zinc-700"></div>
        </div>

        <a href="{{ url_for('auth.login') }}"
           class="block text-center bg-zinc-700 hover:bg-zinc-600 py-3 rounded-lg transition">
            Ya tengo una cuenta
        </a>
    </div>
</div>

{% endblock %}
