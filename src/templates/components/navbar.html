<header class="sticky top-0 z-50 border-b border-zinc-800/40 bg-zinc-900/50 backdrop-blur-md px-6 py-4">
    <div class="flex items-center justify-between max-w-7xl mx-auto">
        <div>
            <h1 class="text-white font-semibold tracking-tight">
                Equipo de Trabajo
            </h1>

            <p class="text-xs text-zinc-500">
                Sistema de Gestión
            </p>
        </div>

        <nav class="flex items-center gap-4">
            <a href="{{ url_for('main.index') }}"
               class="text-zinc-400 hover:text-white transition-colors">
                Inicio
            </a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('main.dashboard') }}"
                   class="text-zinc-400 hover:text-white transition-colors">
                    Dashboard
                </a>
                <div class="h-5 w-px bg-zinc-700"></div>
                <a href="{{ url_for('auth.logout') }}"
                   class="bg-red-600/90 hover:bg-red-700 px-4 py-2 rounded-lg text-sm transition">
                    Salir
                </a>
            {% else %}
                <a href="{{ url_for('auth.login') }}"
                   class="text-zinc-400 hover:text-white transition-colors">
                    Login
                </a>
                <a href="{{ url_for('auth.register') }}"
                   class="bg-blue-600/90 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm transition">
                    Registro
                </a>
            {% endif %}
        </nav>
    </div>
</header>
